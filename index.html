<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Flip Simulator</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #cad2ff;
        }

        .container {
            background-color: #f0f0f0;
            padding: 30px;
            border-radius: 0; /* Sharp edges for the box */
            width: 300px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }

        .coin {
            width: 140px;
            height: 140px;
            margin: 20px auto;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            background-color: #e6e6e6;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.25), inset 0 2px 5px rgba(255, 255, 255, 0.6);
            border: 4px solid #d4d4d4;
        }

        button {
            padding: 10px 24px;
            font-size: 16px;
            font-weight: 600;
            background: #a676ff;
            color: white;
            border: none;
            border-radius: 0; /* Sharp edges for the button */
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #925cef;
        }

        .counter {
            margin-top: 20px;
            font-size: 14px;
            color: #444;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #ccc;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <main class="container">
        <h1>Coin Flip</h1>
        <div class="coin" id="coin"></div>
        <button id="btn" type="button">Flip</button>
        <p id="result"></p>
        
        <section class="counter">
            <div>Heads: <span id="heads-count">0</span></div>
            <div>Tails: <span id="tails-count">0</span></div>
        </section>
    </main>

    <script>
        const coin = document.getElementById("coin");
        const btn = document.getElementById("btn");
        const result = document.getElementById("result");
        const headsCount = document.getElementById("heads-count");
        const tailsCount = document.getElementById("tails-count");

        let heads = 0;
        let tails = 0;

        const headsImage = "url('https://i.ibb.co/ZzGDN07Z/watermarked-img-17780372074896846108.jpg')";
        const tailsImage = "url('https://i.ibb.co/tpZd1d63/360-F-1391850-Uy96-QAl-My-Qg85-P9c4-Oda-YIXHfl-Mb4-W.png')";

        coin.style.backgroundImage = headsImage;

        btn.addEventListener("click", () => {
            const isHeads = Math.random() < 0.5;

            if (isHeads) {
                heads++;
                coin.style.backgroundImage = headsImage;
                result.textContent = "It's Heads!";
            } else {
                tails++;
                coin.style.backgroundImage = tailsImage;
                result.textContent = "It's Tails!";
            }

            headsCount.textContent = heads;
            tailsCount.textContent = tails;
        });
    </script>
</body>
</html>
