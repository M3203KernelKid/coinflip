<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Flip Simulator</title>
    <style>
        :root {
            --bg-color: #cad2ff;
            --container-bg: #f0f0f0;
            --coin-bg: #ffe88d;
            --btn-color: #a676ff;
            --btn-hover: #925cef;
            --text-color: #333;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
        }

        .container {
            background-color: var(--container-bg);
            padding: 30px;
            border-radius: 12px;
            width: 300px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        /* Intro Screen Styles */
        .intro-screen {
            position: absolute;
            background: var(--container-bg);
            padding: 40px 30px;
            border-radius: 12px;
            width: 300px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            z-index: 10;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .intro-screen h1 {
            font-size: 26px;
            margin-bottom: 10px;
            color: var(--text-color);
        }

        .intro-screen p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* Utility class to hide elements gracefully */
        .hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(0.95);
        }

        .coin {
            width: 120px;
            height: 120px;
            background: var(--coin-bg);
            border-radius: 50%;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: var(--text-color);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
            transition: background-color 0.2s ease; 
        }

        button {
            padding: 10px 24px;
            font-size: 16px;
            font-weight: 600;
            background: var(--btn-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background: var(--btn-hover);
        }

        .counter {
            margin-top: 20px;
            font-size: 14px;
            color: #444;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #ccc;
            padding-top: 15px;
        }
    </style>
</head>
<body>


    <div class="intro-screen" id="intro-screen">
        <h1>Welcome! 👋</h1>
        <p>Ready to test your luck? Jump right into the ultimate coin flip simulator.</p>
        <button id="start-btn" type="button">Let's Play</button>
    </div>


    <main class="container" id="game-container">
        <h1>Coin Flip</h1>
        <div class="coin" id="coin">Ready</div>
        <button id="btn" type="button">Flip</button>
        <p id="result" aria-live="polite"></p>
        
        <section class="counter">
            <div>Heads: <span id="heads-count">0</span></div>
            <div>Tails: <span id="tails-count">0</span></div>
        </section>
    </main>

    <script>

        const elements = {
            introScreen: document.getElementById("intro-screen"),
            gameContainer: document.getElementById("game-container"),
            startBtn: document.getElementById("start-btn"),
            btn: document.getElementById("btn"),
            coin: document.getElementById("coin"),
            result: document.getElementById("result"),
            headsCount: document.getElementById("heads-count"),
            tailsCount: document.getElementById("tails-count")
        };

        const state = {
            heads: 0,
            tails: 0
        };


        elements.startBtn.addEventListener("click", () => {
            elements.introScreen.classList.add("hidden");
        });

        function getRandomOutcome() {
            return Math.random() < 0.5 ? "Heads" : "Tails";
        }


        function updateUI(outcome) {
            elements.coin.textContent = outcome;
            elements.result.textContent = `It's ${outcome}!`;
            elements.headsCount.textContent = state.heads;
            elements.tailsCount.textContent = state.tails;
        }


        elements.btn.addEventListener("click", () => {


            const outcome = getRandomOutcome();

            if (outcome === "Heads") {
                state.heads++;
            } else {
                state.tails++;
            }

            updateUI(outcome);
        });
    </script>
</body>
</html>
