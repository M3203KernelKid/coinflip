<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Coin Flip</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #cad2ff;
        }
        .coin {
            width: 120px;
            height: 120px;
            background: #ffe88d;
            border-radius: 50%;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #a676ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Coin Flip</h1>
    <div class="coin" id="coin">Ready</div>
    <button id="btn">Flip</button>
    <p id="result"></p>

    <script>
        document.getElementById("btn").addEventListener("click", function() {
            let outcome = Math.random() < 0.5 ? "Heads" : "Tails";
            document.getElementById("coin").textContent = outcome;
            document.getElementById("result").textContent = `It's ${outcome}!`;
        });
    </script>

</body>
</html>
